name: LiDAR tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 2D SLAM dependency
        run: python3 -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Python LiDAR, IMU, camera and SLAM tests (no hardware)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate radar JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("index.html", "slam.html", "camera.html", "cloud3d.html"):
              html = Path("web", name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              assert len(scripts) == 1, f"Expected one inline script in {name}"
              Path("/tmp/" + name + ".js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/index.html.js
          node --check /tmp/slam.html.js
          node --check /tmp/camera.html.js
          node --check /tmp/cloud3d.html.js
